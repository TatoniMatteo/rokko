packages:
  - .

# pnpm 12: allow only the reviewed lifecycle scripts.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true

# The only ignored advisory has no patched npm release and affects dev-only picomatch.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - electron@45.3.2
